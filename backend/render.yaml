services:
  - type: web
    name: visal-vehicle-booking-backend
    runtime: python3
    buildCommand: pip install -r requirements.txt && FLASK_APP=run.py flask db upgrade
    startCommand: gunicorn --bind 0.0.0.0:$PORT wsgi:app
